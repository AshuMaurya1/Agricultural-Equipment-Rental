<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#C9971C"/>
    </marker>
  </defs>

  <!-- Badge background -->
  <circle cx="100" cy="100" r="96" fill="#E8F0E4"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#2E5339" stroke-width="4"/>

  <!-- Rental rotate arrows -->
  <path d="M 34 70 A 72 72 0 0 1 148 38" fill="none" stroke="#C9971C" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <path d="M 166 130 A 72 72 0 0 1 52 162" fill="none" stroke="#C9971C" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowhead)"/>

  <!-- Ground line -->
  <line x1="18" y1="152" x2="182" y2="152" stroke="#6B4A2F" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

  <!-- Tractor: rear wheel -->
  <circle cx="132" cy="150" r="30" fill="#1A1A1A"/>
  <circle cx="132" cy="150" r="18" fill="#6B4A2F"/>
  <circle cx="132" cy="150" r="5" fill="#E8F0E4"/>

  <!-- Tractor: front wheel -->
  <circle cx="63" cy="155" r="16" fill="#1A1A1A"/>
  <circle cx="63" cy="155" r="9" fill="#6B4A2F"/>

  <!-- Tractor: hood / engine block -->
  <path d="M 45 138 L 45 118 L 96 108 L 96 138 Z" fill="#6B4A2F"/>
  <circle cx="52" cy="122" r="5" fill="#C9971C"/>

  <!-- Tractor: chassis link -->
  <rect x="90" y="128" width="46" height="10" fill="#2E5339"/>

  <!-- Tractor: cabin -->
  <path d="M 96 108 L 96 62 L 132 62 L 146 90 L 146 108 Z" fill="#2E5339"/>
  <path d="M 103 70 L 126 70 L 136 90 L 103 90 Z" fill="#E8F0E4" opacity="0.85"/>

  <!-- Tractor: exhaust pipe -->
  <rect x="100" y="46" width="8" height="20" rx="3" fill="#1A1A1A"/>
</svg>
