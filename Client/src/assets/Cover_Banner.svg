<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
  <defs>
    <marker id="arrowhead3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#C9971C"/>
    </marker>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="1600" height="700" fill="#F4EFE2"/>

  <!-- Sun -->
  <circle cx="1360" cy="130" r="90" fill="#F5D98A"/>

  <!-- Far hills -->
  <path d="M0 430 Q 200 370 420 420 T 900 410 T 1600 430 L 1600 700 L 0 700 Z" fill="#C7DDB0"/>
  <!-- Near field -->
  <path d="M0 480 Q 260 430 560 470 T 1120 460 T 1600 480 L 1600 700 L 0 700 Z" fill="#9FC17E"/>
